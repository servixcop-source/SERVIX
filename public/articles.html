  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0f172a',
              navyLight: '#1e293b',
              emerald: '#10b981',
              emeraldDark: '#059669',
              emeraldLight: '#34d399',
            }
          },
          fontFamily: {
            sans: ['Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * { font-family: 'Arial', sans-serif !important; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined' !important; }
    
    /* Blog Content Styles */
    .prose h1 { font-size: 2.25rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem; margin-top: 2rem; }
    .prose h2 { font-size: 1.875rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem; margin-top: 2rem; }
    .prose h3 { font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 0.75rem; margin-top: 1.5rem; }
    .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #334155; font-size: 1.125rem; }
    .prose ul { list-style-type: disc; padding-inline-start: 1.5rem; margin-bottom: 1.25rem; color: #334155; }
    .prose li { margin-bottom: 0.5rem; }
    .prose strong { font-weight: 800; color: #0f172a; }
  </style>
</head>
<body class="antialiased bg-slate-50 selection:bg-brand-emerald selection:text-white flex flex-col min-h-screen">

  <!-- Header Navigation Bar -->
  <header class="fixed top-0 w-full z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-4">
      
      <!-- Official Brand Logo -->
      <a href="/index.html" class="flex items-center gap-3 shrink-0 me-16 sm:me-24">
        <img id="site-logo-nav" src="/assets/logo.png" alt="سيرفكس SERVIX Logo" class="max-h-12 sm:max-h-16 w-auto h-auto object-contain scale-[1.8] sm:scale-[2.2] origin-right transition-all duration-300">
      </a>

      <!-- Quick Actions -->
      <div class="flex items-center gap-3 shrink-0">
        <a href="/index.html" class="inline-flex items-center gap-2 text-slate-600 hover:text-brand-emerald font-bold transition-colors">
          <span id="nav-back">العودة للرئيسية</span>
          <span class="material-symbols-outlined rtl:rotate-180">arrow_forward</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 pt-32 pb-24">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div id="loading" class="text-center py-20">
        <span class="material-symbols-outlined text-4xl text-brand-emerald animate-spin">refresh</span>
        <p id="msg-loading" class="mt-4 text-slate-500 font-bold">جاري تحميل المقال...</p>
      </div>

      <div id="error-msg" class="hidden text-center py-20">
        <span class="material-symbols-outlined text-6xl text-red-500">error</span>
        <h2 id="msg-notfound" class="mt-4 text-2xl font-extrabold text-brand-navy">عذراً، المقال غير موجود</h2>
        <a href="/index.html" id="btn-back" class="mt-6 inline-block px-6 py-3 bg-brand-emerald text-white rounded-xl font-bold">العودة للرئيسية</a>
      </div>

      <div class="text-center space-y-4 mb-12">
        <h1 id="art-title" class="text-4xl sm:text-5xl font-extrabold text-brand-navy">المدونة</h1>
        <p id="art-desc" class="text-slate-600 text-lg">أحدث المقالات والأخبار في إدارة المرافق والصيانة.</p>
      </div>

      <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Articles injected here -->
      </div>

    </div>
  </main>

  <footer class="bg-brand-navy text-center py-6 border-t border-slate-800 mt-auto">
    <div class="flex flex-col gap-2">
      <p id="footer-text" class="text-slate-400 text-sm font-bold">جميع الحقوق محفوظة &copy; 2026 سيرفكس لإدارة المرافق.</p>
      <a id="footer-designed" href="https://wa.me/966541430116" target="_blank" class="text-slate-400 text-xs font-bold hover:text-brand-emerald transition-colors">صمم بواسطة رواد الرقمية للخدمات التقنية</a>
    </div>
  </footer>

  <script>
    let currentLang = localStorage.getItem('servix_lang') || 'ar';

    function applyStaticLang() {
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = currentLang;

      const dict = {
        en: {
          'nav-back': 'Back to Home',
          'msg-loading': 'Loading articles...',
          'msg-notfound': 'No Articles Found',
          'btn-back': 'Back to Home',
          'footer-text': 'All rights reserved © 2026 Servix Facility Management.',
          'art-title': 'Blog',
          'art-desc': 'Latest articles and news in facility management and maintenance.',
          'footer-designed': 'Designed by Rowad Al-Raqmiyah Tech Services'
        },
        ar: {
          'nav-back': 'العودة للرئيسية',
          'msg-loading': 'جاري تحميل المقالات...',
          'msg-notfound': 'لا توجد مقالات حالياً',
          'btn-back': 'العودة للرئيسية',
          'footer-text': 'جميع الحقوق محفوظة © 2026 سيرفكس لإدارة المرافق.',
          'art-title': 'المدونة',
          'art-desc': 'أحدث المقالات والأخبار في إدارة المرافق والصيانة.',
          'footer-designed': 'صمم بواسطة رواد الرقمية للخدمات التقنية'
        }
      };

      for (const [id, text] of Object.entries(dict[currentLang])) {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
      }
    }

    async function loadArticles() {
      try {
        const res = await fetch(`/api/public/articles`);
        const json = await res.json();
        
        if (json.success && json.articles && json.articles.length > 0) {
          renderArticles(json.articles);
          fetchLogo(); 
        } else {
          showError();
        }
      } catch(e) {
        console.error(e);
        showError();
      }
    }

    async function fetchLogo() {
      try {
        const res = await fetch('/api/public/data');
        const json = await res.json();
        if (json.success && json.logo) {
          const logoNav = document.getElementById('site-logo-nav');
          if (logoNav) logoNav.src = json.logo.url || '/assets/logo.png';
        }
      } catch(e) {}
    }

    function renderArticles(articles) {
      document.getElementById('loading').classList.add('hidden');
      const container = document.getElementById('articles-grid');
      container.innerHTML = '';

      const isEn = currentLang === 'en';
      
      articles.forEach(art => {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-xl transition-shadow flex flex-col group';
        const imgUrl = art.imageUrl || '/assets/logo.png';
        const dateStr = art.date ? `<span class="text-xs font-bold text-slate-400 mb-2 block">${art.date}</span>` : '';
        
        const displayTitle = isEn ? (art.titleEn || art.title) : art.title;
        const displayDesc = isEn ? (art.shortDescEn || art.shortDesc) : art.shortDesc;

        div.innerHTML = `
          <a href="/article.html?slug=${art.slug}" class="block aspect-video overflow-hidden">
            <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          </a>
          <div class="p-6 flex flex-col flex-1">
            ${dateStr}
            <h3 class="font-extrabold text-lg text-brand-navy mb-3 line-clamp-2 leading-snug group-hover:text-brand-emerald transition-colors"><a href="/article.html?slug=${art.slug}">${displayTitle}</a></h3>
            <p class="text-sm text-slate-500 font-normal mb-5 line-clamp-3 leading-relaxed flex-1">${displayDesc || ''}</p>
            <a href="/article.html?slug=${art.slug}" class="inline-flex items-center gap-1.5 text-brand-emerald font-extrabold text-sm hover:gap-2 transition-all mt-auto w-max">
              <span>${isEn ? 'Read More' : 'اقرأ المزيد'}</span>
              <span class="material-symbols-outlined text-sm rtl:rotate-180">arrow_forward</span>
            </a>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error-msg').classList.remove('hidden');
    }

    function shareTwitter(e) {
      e.preventDefault();
      const url = encodeURIComponent(window.location.href);
      const text = encodeURIComponent(document.getElementById('art-title').innerText);
      window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyStaticLang();
      loadArticles();
    });
  </script>
</body>
</html>
